name: Build HGhub iOS IPA

on:

  workflow_dispatch:

jobs:

  build:

    runs-on: macos-15

    steps:

      - name: Checkout source

        uses: actions/checkout@v4

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: '22'

      - name: Setup pnpm

        uses: pnpm/action-setup@v4

        with:

          version: '10'

      - name: Setup Rust

        uses: dtolnay/rust-toolchain@stable

        with:

          targets: aarch64-apple-ios

      - name: Install dependencies

        run: |

          brew install xcodegen cocoapods

          pnpm install --frozen-lockfile

      - name: Initialize iOS

        run: pnpm tauri ios init --ci

      - name: Build unsigned iOS app

        run: |

          cd src-tauri/gen/apple

          xcodebuild \

            -project huangguo-client.xcodeproj \

            -scheme huangguo-client_iOS \

            -configuration Release \

            -sdk iphoneos \

            -destination 'generic/platform=iOS' \

            -derivedDataPath "$RUNNER_TEMP/ios-build" \

            CODE_SIGNING_ALLOWED=NO \

            CODE_SIGNING_REQUIRED=NO \

            CODE_SIGN_IDENTITY="" \

            build

      - name: Package unsigned IPA

        run: |

          mkdir -p "$RUNNER_TEMP/ipa/Payload"

          APP_PATH=$(find "$RUNNER_TEMP/ios-build/Build/Products/Release-iphoneos" \

            -maxdepth 1 -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then

            echo "Error: iOS app not found"

            exit 1

          fi

          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"

          zip -qry "$GITHUB_WORKSPACE/HGhub-unsigned.ipa" Payload

      - name: Upload IPA

        uses: actions/upload-artifact@v4

        with:

          name: HGhub-iOS-unsigned

          path: HGhub-unsigned.ipa

          if-no-files-found: error

      
