name: Build HGhub iOS IPA

on:

  workflow_dispatch:

jobs:

  build:

    name: Build unsigned iOS IPA

    runs-on: macos-15-intel

    permissions:

      contents: read

    steps:

      # 1. 下载源码

      - name: Checkout source

        uses: actions/checkout@v4

      # 2. 配置 Node.js

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: '22'

      # 3. 配置 pnpm

      - name: Setup pnpm

        uses: pnpm/action-setup@v4

        with:

          version: '10'

      # 4. 配置 Rust

      - name: Setup Rust

        uses: dtolnay/rust-toolchain@stable

        with:

          targets: aarch64-apple-ios

      # 5. 安装依赖

      - name: Install dependencies

        run: |

          set -e

          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

          pod --version

          pnpm install --frozen-lockfile

      # 6. 升级 Tauri CLI

      - name: Upgrade Tauri CLI

        run: |

          set -e

          pnpm add -D @tauri-apps/cli@2.11.4 --save-exact

          pnpm tauri --version

          pnpm tauri ios build --help

      # 7. 初始化 iOS 工程

      - name: Initialize iOS

        run: |

          pnpm tauri ios init --ci

      # 8. 通过 Tauri 构建无签名 iOS 归档

      - name: Build unsigned iOS archive

        run: |

          set -euxo pipefail

          pnpm tauri ios build --ci --target aarch64 --no-sign --archive-only

      # 9. 检查构建结果

      - name: Check iOS archive

        run: |

          set -euo pipefail

          echo "Searching for iOS archive..."

          find src-tauri/gen/apple -name "*.xcarchive" -type d -print

          APP_PATH="$(find src-tauri/gen/apple -path '*/Products/Applications/*.app' -type d -print -quit)"

          if [ -z "$APP_PATH" ]; then

            echo "ERROR: iOS application not found"

            exit 1

          fi

          echo "Found application: $APP_PATH"

          APP_BIN="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"

          test -s "$APP_PATH/$APP_BIN"

          file "$APP_PATH/$APP_BIN"

      # 10. 打包无签名 IPA

      - name: Package unsigned IPA

        run: |

          set -euo pipefail

          APP_PATH="$(find src-tauri/gen/apple -path '*/Products/Applications/*.app' -type d -print -quit)"

          if [ -z "$APP_PATH" ]; then

            echo "ERROR: iOS application not found"

            exit 1

          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"

          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/$(basename "$APP_PATH")"

          cd "$RUNNER_TEMP/ipa"

          zip -qry "$GITHUB_WORKSPACE/HGhub-unsigned.ipa" Payload

          echo "IPA package created successfully"

          ls -lh "$GITHUB_WORKSPACE/HGhub-unsigned.ipa"

      # 11. 上传 IPA 安装包

      - name: Upload IPA

        uses: actions/upload-artifact@v4

        with:

          name: HGhub-iOS-unsigned

          path: HGhub-unsigned.ipa

          if-no-files-found: error

          retention-days: 7
