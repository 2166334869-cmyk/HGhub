name: Build HGhub iOS IPA

on:

  workflow_dispatch:

jobs:

  build:

    name: Build unsigned iOS IPA

    runs-on: macos-15-intel

    permissions:

      contents: read

    steps:

      # 1. 下载源码

      - name: Checkout source

        uses: actions/checkout@v4

      # 2. 配置 Node.js

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: '22'

      # 3. 配置 pnpm

      - name: Setup pnpm

        uses: pnpm/action-setup@v4

        with:

          version: '10'

      # 4. 配置 Rust

      - name: Setup Rust

        uses: dtolnay/rust-toolchain@stable

        with:

          targets: aarch64-apple-ios

      # 5. 安装项目依赖

      - name: Install dependencies

        run: |

          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

          pod --version

          pnpm install --frozen-lockfile

      # 6. 初始化 iOS 工程

      - name: Initialize iOS

        run: |

          pnpm tauri ios init --ci

      # 7. 编译前端

      - name: Build frontend

        run: |

          pnpm build

      # 8. 无签名编译 iOS APP

      - name: Build unsigned iOS app

        run: |

          set -euxo pipefail

          cd src-tauri/gen/apple

          xcodebuild -project huangguo-client.xcodeproj -scheme huangguo-client_iOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" build

      # 9. 检查 APP

      - name: Check iOS app

        run: |

          set -euo pipefail

          APP_DIR="$RUNNER_TEMP/ios-build/Build/Products/Release-iphoneos"

          echo "Checking iOS build output..."

          ls -la "$APP_DIR"

          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -name '*.app' -type d -print -quit)"

          if [ -z "$APP_PATH" ]; then

            echo "ERROR: iOS app not found"

            exit 1

          fi

          echo "Found app: $APP_PATH"

      # 10. 打包未签名 IPA

      - name: Package unsigned IPA

        run: |

          set -euo pipefail

          APP_DIR="$RUNNER_TEMP/ios-build/Build/Products/Release-iphoneos"

          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -name '*.app' -type d -print -quit)"

          if [ -z "$APP_PATH" ]; then

            echo "ERROR: iOS app not found"

            exit 1

          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"

          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"

          zip -qry "$GITHUB_WORKSPACE/HGhub-unsigned.ipa" Payload

          echo "IPA package created"

          ls -lh "$GITHUB_WORKSPACE/HGhub-unsigned.ipa"

      # 11. 上传 IPA

      - name: Upload IPA

        uses: actions/upload-artifact@v4

        with:

          name: HGhub-iOS-unsigned

          path: HGhub-unsigned.ipa

          if-no-files-found: error

          retention-days: 7
