name: Build HGhub iOS IPA (Playback Fix)

on:

  workflow_dispatch:

jobs:

  build:

    name: Build unsigned iOS IPA

    runs-on: macos-15-intel

    permissions:

      contents: read

    steps:

      - name: Checkout source

        uses: actions/checkout@v4

      - name: Apply playback API fix

        shell: bash

        run: |

          set -euo pipefail

          curl --fail --location --retry 3 --silent --show-error 'https://github.com/zxsos/HGhub/commit/977a40decdddf7dac29537b8b83862d44c6dfece.patch' --output "$RUNNER_TEMP/playback-fix.patch"

          git apply --check "$RUNNER_TEMP/playback-fix.patch"

          git apply "$RUNNER_TEMP/playback-fix.patch"

          git diff --check

          git diff --stat

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: '22'

      - name: Setup pnpm

        uses: pnpm/action-setup@v4

        with:

          version: '10'

      - name: Setup Rust

        uses: dtolnay/rust-toolchain@stable

        with:

          targets: aarch64-apple-ios

      - name: Install dependencies

        run: |

          set -e

          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

          pod --version

          pnpm install --frozen-lockfile

      - name: Upgrade Tauri CLI

        run: |

          set -e

          pnpm add -D @tauri-apps/cli@2.11.4 --save-exact

          pnpm tauri --version

      - name: Initialize iOS

        run: pnpm tauri ios init --ci

      - name: Build unsigned iOS archive

        run: |

          set -euxo pipefail

          pnpm tauri ios build --ci --target aarch64 --no-sign --archive-only

      - name: Check iOS archive

        run: |

          set -euo pipefail

          find src-tauri/gen/apple -name '*.xcarchive' -type d -print

          APP_PATH="$(find src-tauri/gen/apple -path '*/Products/Applications/*.app' -type d -print -quit)"

          if [ -z "$APP_PATH" ]; then

            echo 'ERROR: iOS application not found'

            exit 1

          fi

          echo "Found application: $APP_PATH"

          APP_BIN="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"

          test -s "$APP_PATH/$APP_BIN"

          file "$APP_PATH/$APP_BIN"

      - name: Package unsigned IPA

        run: |

          set -euo pipefail

          APP_PATH="$(find src-tauri/gen/apple -path '*/Products/Applications/*.app' -type d -print -quit)"

          if [ -z "$APP_PATH" ]; then

            echo 'ERROR: iOS application not found'

            exit 1

          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"

          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/$(basename "$APP_PATH")"

          cd "$RUNNER_TEMP/ipa"

          zip -qry "$GITHUB_WORKSPACE/HGhub-playback-fix-unsigned.ipa" Payload

          ls -lh "$GITHUB_WORKSPACE/HGhub-playback-fix-unsigned.ipa"

      - name: Upload IPA

        uses: actions/upload-artifact@v4

        with:

          name: HGhub-iOS-playback-fix-unsigned

          path: HGhub-playback-fix-unsigned.ipa

          if-no-files-found: error

          retention-days: 7
